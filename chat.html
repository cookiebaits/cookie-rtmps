<!DOCTYPE html>
<html>
<head>
    <title>Combined Chat</title>
    <style>
        body { margin: 0; padding: 0; background: transparent; overflow: hidden; display: flex; height: 100vh; font-family: sans-serif; }
        #chat-container { display: flex; width: 100%; height: 100%; background: transparent; }
        .chat-column { flex: 1; height: 100%; position: relative; border-right: 1px solid rgba(255,255,255,0.1); }
        .chat-column:last-child { border-right: none; }
        iframe { border: none; width: 100%; height: 100%; background: transparent; }
        .platform-icon {
            position: absolute;
            top: 10px;
            right: 25px;
            width: 32px;
            height: 32px;
            pointer-events: none;
            z-index: 10;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.8));
            opacity: 0.6;
        }
        .status-msg {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            padding: 20px;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const container = document.getElementById('chat-container');

        const platforms = [
            { id: 'twitch', name: 'Twitch', icon: 'https://upload.wikimedia.org/wikipedia/commons/d/d3/Twitch_Glitch_Logo_Purple.svg', url: (c) => `https://www.twitch.tv/embed/${c}/chat?parent=${window.location.hostname || 'localhost'}&darkpopout` },
            { id: 'youtube', name: 'YouTube', icon: 'https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg', url: (c) => `https://www.youtube.com/live_chat?v=${c}&embed_domain=${window.location.hostname || 'localhost'}` },
            { id: 'kick', name: 'Kick', icon: 'https://upload.wikimedia.org/wikipedia/commons/1/1d/Kick_logo.svg', url: (c) => `https://kick.com/popout/${c}/chat` },
            { id: 'tiktok', name: 'TikTok', icon: 'https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg', url: (c) => `https://www.tiktok.com/chat/?channel=${c}` }
        ];

        platforms.forEach(p => {
            const channel = urlParams.get(p.id);
            if (channel) {
                const col = document.createElement('div');
                col.className = 'chat-column';

                const img = document.createElement('img');
                img.src = p.icon;
                img.className = 'platform-icon';
                col.appendChild(img);

                if (p.id === 'youtube') {
                    const statusDiv = document.createElement('div');
                    statusDiv.className = 'status-msg';
                    statusDiv.innerText = 'Detecting YouTube Live Stream...';
                    col.appendChild(statusDiv);

                    let currentIframe = null;

                    async function resolveAndLoadYT() {
                        try {
                            const resp = await fetch(`/yt_video_id?channel=${encodeURIComponent(channel)}`);
                            if (resp.ok) {
                                const videoId = (await resp.text()).trim();
                                if (videoId) {
                                    if (!currentIframe || currentIframe.dataset.videoId !== videoId) {
                                        if (statusDiv.parentNode) {
                                            col.removeChild(statusDiv);
                                        }
                                        if (currentIframe) {
                                            col.removeChild(currentIframe);
                                        }
                                        const iframe = document.createElement('iframe');
                                        iframe.dataset.videoId = videoId;
                                        iframe.src = p.url(videoId);
                                        col.appendChild(iframe);
                                        currentIframe = iframe;
                                    }
                                    return;
                                }
                            }
                        } catch (e) {
                            console.error('Error fetching YouTube live video ID:', e);
                        }

                        if (!currentIframe) {
                            statusDiv.innerText = `YouTube channel (${channel}) is currently offline or video ID not found. Retrying...`;
                        }
                    }

                    resolveAndLoadYT();
                    setInterval(resolveAndLoadYT, 30000);
                } else {
                    const iframe = document.createElement('iframe');
                    iframe.src = p.url(channel);
                    col.appendChild(iframe);
                }

                container.appendChild(col);
            }
        });

        if (container.children.length === 0) {
            container.innerHTML = '<div style="color: white; padding: 20px;">No channels specified. Add ?twitch=CHANNEL or ?youtube=CHANNEL to the URL.</div>';
        }
    </script>
</body>
</html>
